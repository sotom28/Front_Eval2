name: CI/CD Frontend

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  
          password: ${{ secrets.DOCKERHUB_TOKEN_FRONT_EV2 }}

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Deploy en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST_EV2 }}
          username: ${{ secrets.EC2_USER_EV2}}
          key: ${{ secrets.EC2_SSH_KEY_EV2}}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            cd /home/ec2-user/app
            docker compose down
            docker compose up -d